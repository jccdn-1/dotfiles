[window]
# padding = { x = 10, y = 10 }
opacity = 0.95
option_as_alt = "Both"
decorations = "buttonless"
startup_mode = "Maximized"

[font]
size = 14

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[general]
import = [
    "~/.config/alacritty/themes/themes/campbell.toml"
]

[cursor]
style = { shape = "Beam", blinking = "On" }

[terminal.shell]
program = "/bin/zsh"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
