name: ${PROJECT_DIR}
services:
  claude:
    image: joao/claude-code:latest
    working_dir: /workspace
    stdin_open: true
    tty: true

    environment:
      - TERM=xterm-256color
      - SHELL=/usr/bin/zsh

    volumes:
      - ${PROJECT_DIR}:/workspace
      - ${HOME}/.config/claude-code/projects/${PROJECT_SLUG}/home:/root
